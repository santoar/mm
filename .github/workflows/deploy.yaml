name: Deploy mm to Cloud Run
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set project and region
      run: |
        gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
        gcloud config set run/region "${{ secrets.GCP_REGION }}"

    - name: Build and push Docker image
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/mm

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy mm \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/mm \
          --region ${{ secrets.GCP_REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --min-instances 1 \
          --memory 1Gi \
          --cpu 1 \
          --no-cpu-throttling \
          --set-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}